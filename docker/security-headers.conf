# Security response headers shared by the app and by every proxied service.
#
# nginx's `add_header` is inherited only while a location does not declare an
# `add_header` of its own. The cache locations do, so they include this file
# again. Keep every header here rather than in individual locations, or one
# of them will silently lose the set.
#
# HSTS is deliberately conditional: `$hsts_header` is set by the map in
# default.conf.template only when the request arrived over HTTPS (directly or
# via the Caddy TLS overlay). Sending HSTS over plain HTTP is ignored by
# browsers, but keeping it off HTTP avoids pinning a host that has no TLS yet.

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "no-referrer" always;
add_header X-Permitted-Cross-Domain-Policies "none" always;
add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;
add_header Permissions-Policy "accelerometer=(), camera=(), display-capture=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=(), fullscreen=(self)" always;

# The app is a single-page bundle with one external entry script. React
# Native Web injects styles at runtime, so style-src needs 'unsafe-inline';
# scripts do not. Remote artwork and audio are allowed because a server may
# be connected directly (not through the same-origin proxy), and the
# integrations talk to public HTTPS endpoints. `http:` and `ws:` stay for
# LAN servers and development builds; remove them if every service is HTTPS.
add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self'; script-src-elem 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https: http:; media-src 'self' data: blob: https: http:; font-src 'self' data:; connect-src 'self' https: http: wss: ws:; worker-src 'self' blob:; manifest-src 'self'" always;

add_header Strict-Transport-Security $hsts_header always;
